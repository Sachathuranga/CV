<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Learning Platform - Login</title>
    <link rel="stylesheet" href="powerbi-styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>📊 Power BI Master Course</h1>
                <p>8-Week Complete Training Program</p>
            </div>

            <form id="loginForm" class="login-form">
                <h2>Student Login</h2>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-primary">Login</button>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <div class="demo-credentials">
                    <p><strong>Demo Credentials:</strong></p>
                    <p>Username: <code>student</code> | Password: <code>demo123</code></p>
                    <p>Username: <code>john</code> | Password: <code>password</code></p>
                </div>
            </form>

            <div class="register-link">
                <p>New student? <a href="#" id="registerLink">Create an account</a></p>
            </div>
        </div>

        <!-- Registration Modal -->
        <div id="registerModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Register New Student</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" required placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" required placeholder="Choose a password">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" required placeholder="Your email address">
                    </div>
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" required placeholder="Your full name">
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>

    <script src="powerbi-app.js"></script>
</body>
</html>
